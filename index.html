<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Grid Scheduler</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --text-muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 16px;
            box-sizing: border-box;
        }

        h2 { 
            margin-top: 0; 
            text-align: center; 
            font-size: 1.15rem; 
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; color: var(--text-muted); }
        input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; background: #f8fafc; color: var(--text-main); }
        input:focus { outline: none; border-color: #3b82f6; background: #fff; }
        
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.95rem; 
            cursor: pointer; 
            margin-top: 4px;
        }

        .calendar-months { margin-top: 24px; }
        .month-container { margin-bottom: 28px; }
        
        .month-title { 
            font-weight: 700; 
            font-size: 0.95rem; 
            margin-bottom: 10px; 
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Standard Monthly Calendar Grid Layout */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .weekday-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .calendar-day {
            background: white;
            border-radius: 6px;
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
        }

        .date-number {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 15;
            pointer-events: none;
        }

        .day-slots {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .half-slot {
            flex: 1;
            height: 100%;
        }

        /* Floating Center Initials Typography Overlay */
        .center-initials-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            z-index: 12;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 Cabin Block Grid Scheduler</h2>
    
    <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Cousin Sarah">
    </div>
    <div class="form-group">
        <label for="initials">Initials</label>
        <input type="text" id="initials" placeholder="e.g. S" maxlength="1">
    </div>
    <div class="form-group">
        <label for="checkIn">Check-In Date</label>
        <input type="date" id="checkIn">
    </div>
    <div class="form-group">
        <label for="checkOut">Check-Out Date</label>
        <input type="date" id="checkOut">
    </div>
    <button id="submitBtn" onclick="addReservation()">Submit Reservation</button>

    <div class="calendar-months" id="calendarMonths"></div>
</div>

<script>
    // Vibrant, soft theme palettes to distribute colors across family branches randomly
    const PALETTES = [
        { bg: '#dbeafe', text: '#1d4ed8' }, // Soft Blue
        { bg: '#dcfce7', text: '#15803d' }, // Soft Green
        { bg: '#fef9c3', text: '#a16207' }, // Soft Yellow
        { bg: '#fce7f3', text: '#be185d' }, // Soft Pink
        { bg: '#f3e8ff', text: '#6b21a8' }, // Soft Purple
        { bg: '#ffedd5', text: '#c2410c' }  // Soft Orange
    ];

    // Seed data featuring distinct colors automatically assigned 
    let bookings = [
        { id: 1, initials: 'S', name: 'Cousin Sarah', start: '2026-10-02', end: '2026-10-06', color: PALETTES[0] },
        { id: 2, initials: 'J', name: 'Uncle John', start: '2026-10-09', end: '2026-10-12', color: PALETTES[1] }
    ];

    function renderCalendar() {
        const container = document.getElementById('calendarMonths');
        container.innerHTML = '';

        const current = new Date();
        const months = [
            { year: current.getFullYear(), month: current.getMonth() },
            { year: current.getFullYear() + (current.getMonth() == 11 ? 1 : 0), month: (current.getMonth() + 1) % 12 }
        ];

        months.forEach(m => {
            const mDiv = document.createElement('div');
            mDiv.className = 'month-container';
            
            const firstDayObj = new Date(m.year, m.month, 1);
            const monthName = firstDayObj.toLocaleString('default', { month: 'long', year: 'numeric' });
            mDiv.innerHTML = `<div class="month-title">${monthName}</div>`;

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';

            // Print standard day name headers
            ['S','M','T','W','T','F','S'].forEach(dayName => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'weekday-header';
                dayHeader.innerText = dayName;
                grid.appendChild(dayHeader);
            });

            const startDayOffset = firstDayObj.getDay(); 
            const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

            // Offset empty blocks for calendar alignment
            for (let i = 0; i < startDayOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                grid.appendChild(emptyCell);
            }

            // Map and parse the actual calendar days
            for (let d = 1; d <= daysInMonth; d++) {
                const currentLoopDate = new Date(m.year, m.month, d);
                const dateStr = currentLoopDate.toISOString().split('T')[0];

                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.innerHTML = `<div class="date-number">${d}</div>`;

                const slotsContainer = document.createElement('div');
                slotsContainer.className = 'day-slots';

                // Evaluate cross-over checks
                let amBooked = bookings.find(b => dateStr > b.start && dateStr <= b.end);
                let pmBooked = bookings.find(b => dateStr >= b.start && dateStr < b.end);

                const amSlot = document.createElement('div');
                amSlot.className = 'half-slot';
                if (amBooked) {
                    amSlot.style.backgroundColor = amBooked.color.bg;
                }

                const pmSlot = document.createElement('div');
                pmSlot.className = 'half-slot';
                if (pmBooked) {
                    pmSlot.style.backgroundColor = pmBooked.color.bg;
                }

                slotsContainer.appendChild(amSlot);
                slotsContainer.appendChild(pmSlot);
                dayCell.appendChild(slotsContainer);

                // Math to superimpose the initial ONLY on the absolute middle day of the reservation stay
                let activeBooking = pmBooked || amBooked;
                if (activeBooking) {
                    const tStart = new Date(activeBooking.start + 'T00:00:00');
                    const tEnd = new Date(activeBooking.end + 'T00:00:00');
                    const totalNights = Math.round((tEnd - tStart) / (1000 * 60 * 60 * 24));
                    
                    const middleNightsOffset = Math.floor(totalNights / 2);
                    const targetMiddleDate = new Date(tStart);
                    targetMiddleDate.setDate(tStart.getDate() + middleNightsOffset);
                    const targetMiddleStr = targetMiddleDate.toISOString().split('T')[0];

                    if (dateStr === targetMiddleStr) {
                        const overlay = document.createElement('div');
                        overlay.className = 'center-initials-overlay';
overlay.innerText = activeBooking.initials;
overlay.style.color = activeBooking.color.text;
dayCell.appendChild(overlay);
}
}
grid.appendChild(dayCell);
}
mDiv.appendChild(grid);
container.appendChild(mDiv);
});
}
function addReservation() {
const name = document.getElementById('fullName').value;
const initials = document.getElementById('initials').value.toUpperCase();
const start = document.getElementById('checkIn').value;
const end = document.getElementById('checkOut').value;
if (!name || !initials || !start || !end) {
alert('Please fill out all fields.');
return;
}
// Cycle through color themes randomly
const assignedColor = PALETTES[bookings.length % PALETTES.length];
bookings.push({
id: Date.now(),
initials: initials.substring(0,1), // Hard limit to single character layout rule
name: name,
start: start,
end: end,
color: assignedColor
});
renderCalendar();
document.getElementById('fullName').value = '';
document.getElementById('initials').value = '';
document.getElementById('checkIn').value = '';
document.getElementById('checkOut').value = '';
}
renderCalendar();
