<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Scheduler Matrix</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --accent-color: #3b82f6;
            --accent-light: #eff6ff;
            --text-muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 16px;
            box-sizing: border-box;
        }

        h2 { 
            margin-top: 0; 
            text-align: center; 
            font-size: 1.15rem; 
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; color: var(--text-muted); }
        input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; background: #f8fafc; color: var(--text-main); }
        input:focus { outline: none; border-color: var(--accent-color); background: #fff; }
        
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.95rem; 
            cursor: pointer; 
            margin-top: 4px;
        }
        button:hover { background-color: #2563eb; }

        .calendar-months { margin-top: 24px; }
        .month-container { margin-bottom: 24px; }
        
        .month-title { 
            font-weight: 700; 
            font-size: 0.95rem; 
            margin-bottom: 10px; 
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Tight Horizontal Matrix Layout */
        .timeline-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #f1f5f9;
            -webkit-overflow-scrolling: touch;
        }

        .timeline-grid { 
            display: flex;
            flex-direction: row;
        }

        .day-column {
            display: flex;
            flex-direction: column;
            min-width: 50px;
            background: white;
            border-right: 1px solid #e2e8f0;
            position: relative;
        }

        .date-header {
            padding: 6px 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .slots-container {
            display: flex;
            height: 38px;
            position: relative;
        }

        .half-slot {
            flex: 1;
            height: 100%;
        }

        .half-slot.booked {
            background-color: #dbeafe; /* Clean blue bar background */
        }

        /* Completely centered text overlay */
        .guest-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #1d4ed8; 
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 Cabin Scheduler Matrix</h2>
    
    <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Cousin Sarah">
    </div>
    <div class="form-group">
        <label for="initials">Initials</label>
        <input type="text" id="initials" placeholder="e.g. SRH" maxlength="3">
    </div>
    <div class="form-group">
        <label for="checkIn">Check-In Date</label>
        <input type="date" id="checkIn">
    </div>
    <div class="form-group">
        <label for="checkOut">Check-Out Date</label>
        <input type="date" id="checkOut">
    </div>
    <button id="submitBtn" onclick="addReservation()">Submit Reservation</button>

    <div class="calendar-months" id="calendarMonths"></div>
</div>

<script>
    // Standalone internal memory array with your default demonstration data
    let bookings = [
        { initials: 'SRH', name: 'Cousin Sarah', start: '2026-10-02', end: '2026-10-04' },
        { initials: 'JON', name: 'Uncle John', start: '2026-10-09', end: '2026-10-12' }
    ];

    function renderCalendar() {
        const container = document.getElementById('calendarMonths');
        container.innerHTML = '';

        // Displays October and November 2026
        const months = [
            { year: 2026, month: 9, name: 'October 2026', days: 31 },
            { year: 2026, month: 10, name: 'November 2026', days: 30 }
        ];

        months.forEach(m => {
            const mDiv = document.createElement('div');
            mDiv.className = 'month-container';
            mDiv.innerHTML = `<div class="month-title">${m.name}</div>`;

            const wrapper = document.createElement('div');
            wrapper.className = 'timeline-wrapper';

            const grid = document.createElement('div');
            grid.className = 'timeline-grid';

            for (let d = 1; d <= m.days; d++) {
                const dateStr = `${m.year}-${String(m.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                // Crossover logical tracking
                let amBooked = bookings.find(b => dateStr > b.start && dateStr <= b.end);
                let pmBooked = bookings.find(b => dateStr >= b.start && dateStr < b.end);

                const dayCol = document.createElement('div');
                dayCol.className = 'day-column';

                const header = document.createElement('div');
                header.className = 'date-header';
                header.innerText = d;
                dayCol.appendChild(header);

                const slotsContainer = document.createElement('div');
                slotsContainer.className = 'slots-container';

                const amSlot = document.createElement('div');
                amSlot.className = 'half-slot' + (amBooked ? ' booked' : '');
                
                const pmSlot = document.createElement('div');
                pmSlot.className = 'half-slot' + (pmBooked ? ' booked' : '');

                slotsContainer.appendChild(amSlot);
                slotsContainer.appendChild(pmSlot);

                // Safe text overlay execution loop
                if (amBooked || pmBooked) {
                    const overlay = document.createElement('div');
                    overlay.className = 'guest-overlay';
                    overlay.innerText = amBooked ? amBooked.initials : pmBooked.initials;
                    slotsContainer.appendChild(overlay);
                }

                dayCol.appendChild(slotsContainer);
                grid.appendChild(dayCol);
            }

            wrapper.appendChild(grid);
            mDiv.appendChild(wrapper);
            container.appendChild(mDiv);
        });
    }

    function addReservation() {
        const name = document.getElementById('fullName').value;
        const initials = document.getElementById('initials').value.toUpperCase();
        const start = document.getElementById('checkIn').value;
        const end = document.getElementById('checkOut').value;

        if (!name || !initials || !start || !end) {
            alert('Please fill out all fields.');
            return;
        }

        bookings.push({ initials, name, start, end });
        renderCalendar();
        
        // Reset form input values
        document.getElementById('fullName').value = '';
        document.getElementById('initials').value = '';
        document.getElementById('checkIn').value = '';
        document.getElementById('checkOut').value = '';
    }

    // Run layout builder on startup
    renderCalendar();
</script>

</body>
</html>
