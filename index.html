<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Scheduler</title>
    <style>
        :root {
            --bg-primary: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --border-color: #e2e8f0;
            --accent-color: #3182ce;
            --accent-light: #ebf8ff;
            --available-color: #48bb78;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        .calendar-months {
            margin-top: 24px;
        }

        .month-container {
            margin-bottom: 20px;
        }

        .month-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 4px;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background-color: var(--border-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .day-cell {
            background: white;
            padding: 8px;
            text-align: center;
            font-size: 0.85rem;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .day-cell.booked {
            background-color: var(--accent-light);
            color: var(--accent-color);
            font-weight: bold;
        }

        .day-cell.available {
            color: #a0aec0;
        }

        .date-num {
            font-size: 0.75rem;
            color: #718096;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 Cabin Scheduler Backend</h2>
    
    <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Cousin Sarah">
    </div>
    <div class="form-group">
        <label for="initials">Initials</label>
        <input type="text" id="initials" placeholder="e.g. SRH" maxlength="3">
    </div>
    <div class="form-group">
        <label for="checkIn">Check-In Date</label>
        <input type="date" id="checkIn">
    </div>
    <div class="form-group">
        <label for="checkOut">Check-Out Date</label>
        <input type="date" id="checkOut">
    </div>
    <button onclick="addReservation()">Submit Reservation</button>

    <div class="calendar-months" id="calendarMonths"></div>
</div>

<script>
    // Hardcoded simulation data matching your previous display state
    let bookings = [
        { initials: 'SRH', name: 'Cousin Sarah', start: '2026-10-02', end: '2026-10-04' },
        { initials: 'JON', name: 'Uncle John', start: '2026-10-09', end: '2026-10-12' }
    ];

    function renderCalendar() {
        const container = document.getElementById('calendarMonths');
        container.innerHTML = '';

        // Generate October and November 2026
        const months = [
            { year: 2026, month: 9, name: 'October 2026', days: 31 },
            { year: 2026, month: 10, name: 'November 2026', days: 30 }
        ];

        months.forEach(m => {
            const mDiv = document.createElement('div');
            mDiv.className = 'month-container';
            mDiv.innerHTML = `<div class="month-title">${m.name}</div>`;

            const grid = document.createElement('div');
            grid.className = 'timeline-grid';

            for (let d = 1; d <= m.days; d++) {
                const dateStr = `${m.year}-${String(m.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                // AM Slot
                const amCell = document.createElement('div');
                amCell.className = 'day-cell';
                let amBooked = bookings.find(b => dateStr > b.start && dateStr <= b.end);
                if (amBooked) {
                    amCell.className += ' booked';
                    amCell.innerHTML = `<div class="date-num">${d} AM</div>${amBooked.initials}`;
                } else {
                    amCell.className += ' available';
                    amCell.innerHTML = `<div class="date-num">${d} AM</div>-`;
                }

                // PM Slot
                const pmCell = document.createElement('div');
                pmCell.className = 'day-cell';
                let pmBooked = bookings.find(b => dateStr >= b.start && dateStr < b.end);
                if (pmBooked) {
                    pmCell.className += ' booked';
                    pmCell.innerHTML = `<div class="date-num">${d} PM</div>${pmBooked.initials}`;
                } else {
                    pmCell.className += ' available';
                    pmCell.innerHTML = `<div class="date-num">${d} PM</div>-`;
                }

                grid.appendChild(amCell);
                grid.appendChild(pmCell);
            }
            mDiv.appendChild(grid);
            container.appendChild(mDiv);
        });
    }

    function addReservation() {
        const name = document.getElementById('fullName').value;
        const initials = document.getElementById('initials').value.toUpperCase();
        const start = document.getElementById('checkIn').value;
        const end = document.getElementById('checkOut').value;

        if (!name || !initials || !start || !end) {
            alert('Please fill out all fields.');
            return;
        }

        bookings.push({ initials, name, start, end });
        renderCalendar();
        
        // Clear input form fields
        document.getElementById('fullName').value = '';
        document.getElementById('initials').value = '';
        document.getElementById('checkIn').value = '';
        document.getElementById('checkOut').value = '';
    }

    // Initial load view assembly
    renderCalendar();
</script>

</body>
</html>
